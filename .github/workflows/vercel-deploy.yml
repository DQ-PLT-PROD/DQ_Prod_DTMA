name: 🚀 Deploy to Vercel (Prod + Preview)

on:
  push:
    branches:
      - main
      - "feature/**"
      - develop
      - "fix/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 🧰 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: ⚙️ Install Vercel CLI
        run: npm install -g vercel

      - name: 🔧 Set Git identity (for Vercel)
        run: |
          git config --global user.email "dq.demo.a@DigitalQatalyst.com"
          git config --global user.name "DigitalQatalyst"

      - name: 🌐 Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "🔍 Branch detected: $BRANCH_NAME"
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "🚀 Deploying PRODUCTION build to Vercel..."
            vercel --prod --token=$VERCEL_TOKEN --yes
          else
            echo "🧪 Deploying PREVIEW build for branch: $BRANCH_NAME ..."
            DEPLOY_URL=$(vercel --token=$VERCEL_TOKEN --yes)
            echo "✅ Preview deployed at: $DEPLOY_URL"
          fi