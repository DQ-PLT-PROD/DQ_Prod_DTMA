server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Handle the /dtma path - serve the SPA
    location /dtma/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /dtma/index.html;
        index index.html;
    }

    # Redirect /dtma to /dtma/
    location = /dtma {
        return 301 /dtma/;
    }

    # Handle assets under /dtma with correct MIME types
    location ~ ^/dtma/assets/.*\.js$ {
        alias /usr/share/nginx/html/;
        types {
            application/javascript js;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ ^/dtma/assets/.*\.css$ {
        alias /usr/share/nginx/html/;
        types {
            text/css css;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ ^/dtma/assets/.*\.(jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot|webp)$ {
        alias /usr/share/nginx/html/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache control for env-config.js under /dtma
    location = /dtma/env-config.js {
        alias /usr/share/nginx/html/env-config.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        types {
            application/javascript js;
        }
    }

    # Cache control for env-config.js at root
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Cache control for index.html at root
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Static assets with long cache (for root path)
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback for root
    location / {
        try_files $uri $uri/ /index.html;
    }
}

