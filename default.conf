server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Handle the specific sub-path
    location /dtma {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /dtma/index.html;

        # Move your existing security/logging inside or keep at server level
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Cache control for index.html inside the sub-path
        location = /dtma/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Cache control for env-config.js inside the sub-path
        location = /dtma/env-config.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Static assets under /dtma/assets/
        location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # 2. Optional: Redirect root to /dtma if someone hits the bare domain
    # location = / {
    #     return 301 /dtma/;
    # }
}

