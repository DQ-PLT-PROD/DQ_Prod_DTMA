pr: none
trigger: none

pool:
  vmImage: ubuntu-latest

variables:
- group: ovh-registry-secrets
- name: imageName
  value: frontend
- name: registry
  value: u4c2j2w9.c1.gra9.container-registry.ovh.net/dtma
- name: imageTag
  value: release-$(Build.BuildId)
- name: namespace
  value: dtma

stages:
- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: Build
    displayName: Docker Build
    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build & Push Frontend
      inputs:
        containerRegistry: OVH-Registry
        repository: dtma/frontend
        command: buildAndPush
        Dockerfile: Dockerfile
        tags: |
          $(imageTag)

- stage: Deploy
  displayName: Deploy to OVH Kubernetes
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: Kubernetes Deploy
    steps:
    - task: KubernetesManifest@1
      displayName: Deploy Frontend
      inputs:
        action: deploy
        kubernetesServiceConnection: OVH-Test-Kubeconfig
        namespace: $(namespace)
        manifests: |
          k8s/overlays/release/deployment.yaml
        containers: |
          $(registry)/$(imageName):$(imageTag)



